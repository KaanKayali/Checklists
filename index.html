<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Checklists</title>

  <!-- Progressive Web App (PWA) & iOS Fullscreen -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f8f9fb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Checklists">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="icon" type="image/png" href="assets/icons/icon-192.png">

  <!-- Bierstadt Typography & Stylesheet -->
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
  <div id="app">
    <!-- View Container: Switches between Master/Detail on Mobile; 2-Column Adaptive on Desktop -->
    <div class="view-container" id="viewContainer">

      <!-- ====================================================================
           Master View: Boards Overview & Sidebar
           ==================================================================== -->
      <aside class="view-master" id="masterView">
        <!-- Transparent Header -->
        <header class="app-header">
          <div class="brand-wrapper">
            <!-- Circular logo with larger white checkmark -->
            <div class="brand-logo" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M8.5 17.2L3.8 12.5l1.8-1.8 2.9 2.9 8.9-8.9 1.8 1.8z"/>
              </svg>
            </div>
            <div class="brand-title-wrap">
              <span class="brand-title" id="brandTitle">Checklists</span>
              <span class="version-badge">v1.0.0</span>
            </div>
          </div>
          <div class="header-actions">
            <!-- 3-Dots Button: White Circle with Horizontal Dots -->
            <button class="btn-circle" id="btnMainMenu" aria-label="Main Menu" title="Menu">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                <circle cx="6" cy="12" r="2"/>
                <circle cx="12" cy="12" r="2"/>
                <circle cx="18" cy="12" r="2"/>
              </svg>
            </button>
          </div>
        </header>

        <!-- Main Menu Dropdown (Select Boards, Sort By, Dark Mode, Settings) -->
        <div class="menu-dropdown" id="mainMenuDropdown">
          <!-- Select Boards -->
          <button class="menu-item" id="menuItemSelectBoards">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-9 14l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
            </svg>
            <span data-i18n="selectBoards">Select Boards</span>
          </button>

          <!-- Sort By with subtitle 'Default (Date Edited)' -->
          <button class="menu-item" id="menuItemSortBy">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M3 18h6v-2H3v2zM3 6v2h18V6H3zm0 7h12v-2H3v2z"/>
            </svg>
            <div class="menu-item-content">
              <span data-i18n="sortBy">Sort By</span>
              <span class="menu-item-subtitle" id="menuSortSubtitle">Default (Date Edited)</span>
            </div>
          </button>

          <!-- Dark Mode Toggle -->
          <button class="menu-item" id="menuItemDarkMode">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" id="darkModeIcon">
              <path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/>
            </svg>
            <span data-i18n="darkMode">Dark Mode</span>
          </button>

          <div class="menu-divider"></div>

          <!-- Settings Modal Opener -->
          <button class="menu-item" id="menuItemSettings">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
            </svg>
            <span data-i18n="settings">Settings</span>
          </button>
        </div>

        <!-- Master Content List -->
        <div class="master-content">
          <!-- Board Counter underneath header, above lists -->
          <div class="board-counter-label" id="boardCounter">0 Boards</div>

          <!-- Pinned Section: Bold Black Header with yellow chevron toggle -->
          <div class="pinned-group" id="pinnedSectionContainer" style="display: none;">
            <div class="section-header-row">
              <span class="section-title-heading" data-i18n="pinnedBoards">Pinned</span>
              <button class="btn-toggle-pinned" id="btnTogglePinned" aria-label="Toggle Pinned Boards" title="Toggle">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                  <path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/>
                </svg>
              </button>
            </div>
            <!-- Card container containing pinned boards with divider lines -->
            <div class="boards-card-container" id="pinnedContainer"></div>
          </div>

          <!-- All Boards Section: Bold Black Header -->
          <div class="all-group">
            <div class="section-header-row">
              <span class="section-title-heading" data-i18n="allBoards">All Boards</span>
            </div>
            <div class="boards-card-container" id="allContainer"></div>
          </div>

          <!-- Footer: @KaanKayali in gray -->
          <footer class="app-footer">
            @KaanKayali
          </footer>
        </div>

        <!-- Floating Action Button (FAB): White Circle with Black Sheet/Pencil Icon -->
        <div class="fab-container">
          <button class="fab-white" id="btnFab" aria-label="New Board" title="New Board">
            <svg viewBox="0 0 24 24">
              <!-- Sheet / surface with pencil over it -->
              <path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/>
            </svg>
          </button>
        </div>
      </aside>

      <!-- ====================================================================
           Detail View: Tasks & Section Management
           ==================================================================== -->
      <main class="view-detail" id="detailView">
        <!-- Transparent Header -->
        <header class="detail-header">
          <div class="detail-header-left">
            <!-- Back Button: White Circle -->
            <button class="btn-circle btn-back" id="btnBack" aria-label="Back" title="Back">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                <path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6 1.41-1.41z"/>
              </svg>
            </button>
            <div class="detail-title-container">
              <input type="text" class="detail-title-input" id="detailTitleInput" placeholder="Board Name...">
              <div class="detail-meta" id="detailTimestamps">Created ... | Edited ...</div>
            </div>
          </div>

          <!-- Detail Header Actions: Undo and 3-Dots in White Circles -->
          <div class="header-actions">
            <!-- Undo Button (Curved arrow): White Circle -->
            <button class="btn-circle" id="btnUndo" disabled title="Undo (Ctrl+Z)" aria-label="Undo">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                <path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/>
              </svg>
            </button>

            <!-- 3-Dots Button: White Circle with Horizontal Dots -->
            <button class="btn-circle" id="btnDetailMenu" aria-label="Board Menu" title="Board Actions">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                <circle cx="6" cy="12" r="2"/>
                <circle cx="12" cy="12" r="2"/>
                <circle cx="18" cy="12" r="2"/>
              </svg>
            </button>
          </div>
        </header>

        <!-- Detail Menu Dropdown (Pin / Unpin and Delete Board only) -->
        <div class="menu-dropdown" id="detailMenuDropdown">
          <button class="menu-item" id="menuItemPin">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" id="pinMenuIcon">
              <path d="M16 9V4l1 0V2H7v2l1 0v5c0 1.66-1.34 3-3 3v2h5.97v7l1 1 1-1v-7H19v-2c-1.66 0-3-1.34-3-3z"/>
            </svg>
            <span id="pinMenuLabel" data-i18n="pin">Pin Board</span>
          </button>
          <div class="menu-divider"></div>
          <button class="menu-item danger" id="menuItemDelete">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/>
            </svg>
            <span data-i18n="deleteBoard">Delete Board</span>
          </button>
        </div>

        <!-- Detail Scrollable Content Area -->
        <div class="detail-content" id="detailContent">
          <div id="sectionsContainer"></div>
        </div>

        <!-- Detail Bottom Action Toolbar: iPhone Wireframe Layout -->
        <footer class="detail-toolbar">
          <!-- Left rounded capsule with Add Day, Cross Out, and Clear Text (backspace icon) -->
          <div class="toolbar-left-group">
            <!-- Add Day / Section -->
            <button class="toolbar-action-btn" id="btnAddSection" title="Add Day / Section" aria-label="Add Section">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                <path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2zm-7 5h5v5h-5z"/>
              </svg>
            </button>

            <!-- Cross Out / Strike line at cursor -->
            <button class="toolbar-action-btn" id="btnCrossOut" title="Cross Out" aria-label="Cross Out">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                <path d="M10 19h4v-3h-4v3zM5 4v3h5v3h4V7h5V4H5zM3 14h18v-2H3v2z"/>
              </svg>
            </button>

            <!-- Clear Text with Backspace (Zurücktaste) Icon -->
            <button class="toolbar-action-btn" id="btnClearText" title="Clear Text" aria-label="Clear Text">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                <path d="M22 3H7c-.69 0-1.23.35-1.59.88L0 12l5.41 8.11c.36.53.9.89 1.59.89h15c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-3 12.59L17.59 17 14 13.41 10.41 17 9 15.59 12.59 12 9 8.41 10.41 7 14 10.59 17.59 7 19 8.41 15.41 12 19 15.59z"/>
              </svg>
            </button>
          </div>

          <!-- Right standalone circle button for Add Task -->
          <button class="toolbar-right-add" id="btnAddTask" title="Add Task" aria-label="Add Task">
            <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor">
              <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
            </svg>
          </button>
        </footer>
      </main>

    </div>
  </div>

  <!-- ====================================================================
       Modals: New Board, New Section, Settings, Confirmation
       ==================================================================== -->

  <!-- Modal: New Board -->
  <div class="modal-backdrop" id="newBoardModal">
    <div class="modal-sheet">
      <div class="modal-header">
        <h3 class="modal-title" data-i18n="newBoard">New Board</h3>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label" data-i18n="boardTitlePlaceholder">Board name...</label>
          <input type="text" class="form-input" id="newBoardTitleInput" data-i18n-placeholder="boardTitlePlaceholder" placeholder="Board name...">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="btnCreateBoardCancel" data-i18n="cancel">Cancel</button>
        <button class="btn btn-primary" id="btnCreateBoardConfirm" data-i18n="create">Create</button>
      </div>
    </div>
  </div>

  <!-- Modal: New Section / Day -->
  <div class="modal-backdrop" id="newSectionModal">
    <div class="modal-sheet">
      <div class="modal-header">
        <h3 class="modal-title" data-i18n="newSectionPrompt">New Section / Day</h3>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label" data-i18n="sectionTitlePlaceholder">Section name...</label>
          <input type="text" class="form-input" id="newSectionTitleInput" data-i18n-placeholder="sectionTitlePlaceholder" placeholder="Section name (e.g. Wednesday:, Weekend:)...">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="btnCreateSectionCancel" data-i18n="cancel">Cancel</button>
        <button class="btn btn-primary" id="btnCreateSectionConfirm" data-i18n="create">Create</button>
      </div>
    </div>
  </div>

  <!-- Modal: Settings & Data Management -->
  <div class="modal-backdrop" id="settingsModal">
    <div class="modal-sheet">
      <div class="modal-header">
        <h3 class="modal-title" data-i18n="settings">Settings</h3>
      </div>
      <div class="modal-body">
        <!-- Font Size in Board -->
        <div class="form-group">
          <label class="form-label" data-i18n="fontSize">Font Size in Board</label>
          <select class="form-select" id="settingFontSize">
            <option value="small" data-i18n="fontSizeSmall">Small</option>
            <option value="medium" data-i18n="fontSizeMedium">Medium</option>
            <option value="large" data-i18n="fontSizeLarge">Large</option>
            <option value="xlarge" data-i18n="fontSizeXLarge">Extra Large</option>
          </select>
        </div>

        <!-- Language -->
        <div class="form-group">
          <label class="form-label" data-i18n="language">Language</label>
          <select class="form-select" id="settingLanguage">
            <option value="en" data-i18n="langEn">English</option>
            <option value="de" data-i18n="langDe">Deutsch</option>
          </select>
        </div>

        <div class="menu-divider" style="margin: 8px 0;"></div>

        <!-- Data Management -->
        <div class="form-group">
          <label class="form-label" data-i18n="dataManagement">Data Management</label>
          <div style="display: flex; gap: 10px; margin-top: 4px;">
            <button class="btn btn-secondary" id="btnExportData" style="flex: 1;">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
              <span data-i18n="exportData">Export JSON</span>
            </button>
            <button class="btn btn-secondary" id="btnImportData" style="flex: 1;">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/></svg>
              <span data-i18n="importData">Import JSON</span>
            </button>
            <input type="file" id="importFileInput" accept=".json,application/json" style="display: none;">
          </div>
        </div>

        <div class="form-group" style="margin-top: 6px;">
          <button class="btn btn-danger" id="btnResetAllData" style="width: 100%;">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
            <span data-i18n="resetData">Delete Data</span>
          </button>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" id="btnCloseSettings" data-i18n="save">Close</button>
      </div>
    </div>
  </div>

  <!-- Modal: Confirmation Dialog -->
  <div class="modal-backdrop" id="confirmModal">
    <div class="modal-sheet">
      <div class="modal-header">
        <h3 class="modal-title" id="confirmModalTitle">Confirm Action</h3>
      </div>
      <div class="modal-body">
        <p id="confirmModalMessage" style="color: var(--text-muted); font-size: 0.95rem;"></p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="btnConfirmCancel" data-i18n="cancel">Cancel</button>
        <button class="btn btn-danger" id="btnConfirmAction" data-i18n="delete">Delete</button>
      </div>
    </div>
  </div>

  <!-- Notification Toast -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- Main JavaScript Module Entry -->
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
