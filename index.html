<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Checklists</title>

  <!-- Progressive Web App (PWA) & iOS Native Fullscreen Optimization -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffc114">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Checklists">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="icon" type="image/png" href="assets/icons/icon-192.png">

  <!-- Bierstadt Typography & Stylesheet -->
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
  <div id="app">
    <!-- View Container: Switches between Master/Detail on Mobile; 2-Column Adaptive on Desktop -->
    <div class="view-container" id="viewContainer">

      <!-- ====================================================================
           Master View: Checklists Overview & Sidebar
           ==================================================================== -->
      <aside class="view-master" id="masterView">
        <!-- Header -->
        <header class="app-header">
          <div class="brand-wrapper">
            <div class="brand-logo" aria-hidden="true">
              <!-- Crisp checkmark in #ffc114 circle -->
              <svg viewBox="0 0 24 24">
                <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
              </svg>
            </div>
            <div class="brand-info">
              <span class="brand-title" id="brandTitle">Checklists v1.0.0</span>
              <span class="brand-meta" id="checklistCounter">0 Checklists</span>
            </div>
          </div>
          <div class="header-actions">
            <button class="btn-icon" id="btnMainMenu" aria-label="Main Menu" title="Menu">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                <path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/>
              </svg>
            </button>
          </div>
        </header>

        <!-- Main Menu Dropdown -->
        <div class="menu-dropdown" id="mainMenuDropdown">
          <button class="menu-item" id="menuItemSettings">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
            </svg>
            <span data-i18n="settings">Settings</span>
          </button>
        </div>

        <!-- Master Content List -->
        <div class="master-content">
          <!-- Pinned Section -->
          <div class="pinned-group" id="pinnedSectionContainer" style="display: none;">
            <div class="section-label">
              <span data-i18n="pinnedChecklists">Pinned Checklists</span>
            </div>
            <div class="checklist-list" id="pinnedList"></div>
          </div>

          <!-- All Checklists Section -->
          <div class="all-group">
            <div class="section-label">
              <span data-i18n="allChecklists">All Checklists</span>
            </div>
            <div class="checklist-list" id="allList"></div>
          </div>
        </div>

        <!-- Floating Action Button (FAB) -->
        <div class="fab-container">
          <button class="fab" id="btnFab" aria-label="Create New Checklist" title="Create Checklist">
            <svg viewBox="0 0 24 24">
              <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
            </svg>
          </button>
        </div>
      </aside>

      <!-- ====================================================================
           Detail View: Tasks & Section Management
           ==================================================================== -->
      <main class="view-detail" id="detailView">
        <!-- Header -->
        <header class="detail-header">
          <div class="detail-header-left">
            <button class="btn-icon btn-back" id="btnBack" aria-label="Back to overview" title="Back">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                <path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6 1.41-1.41z"/>
              </svg>
            </button>
            <div class="detail-title-container">
              <input type="text" class="detail-title-input" id="detailTitleInput" placeholder="Checklist Name...">
              <div class="detail-meta" id="detailTimestamps">Created ... | Edited ...</div>
            </div>
          </div>

          <!-- Detail Header Actions -->
          <div class="header-actions">
            <!-- Undo Button -->
            <button class="btn-icon" id="btnUndo" disabled title="Undo (Ctrl+Z)" aria-label="Undo">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                <path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/>
              </svg>
            </button>

            <!-- Checklist Detail Menu -->
            <button class="btn-icon" id="btnDetailMenu" aria-label="Checklist Menu" title="Checklist Actions">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                <path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/>
              </svg>
            </button>
          </div>
        </header>

        <!-- Detail Menu Dropdown -->
        <div class="menu-dropdown" id="detailMenuDropdown">
          <button class="menu-item" id="menuItemPin">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M16 9V4l1 0V2H7v2l1 0v5c0 1.66-1.34 3-3 3v2h5.97v7l1 1 1-1v-7H19v-2c-1.66 0-3-1.34-3-3z"/>
            </svg>
            <span data-i18n="pin">Pin / Unpin</span>
          </button>
          <button class="menu-item" id="menuItemDuplicate">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/>
            </svg>
            <span data-i18n="duplicate">Duplicate</span>
          </button>
          <button class="menu-item" id="menuItemClearCompleted">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-9 14l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
            </svg>
            <span data-i18n="clearCompleted">Clear Completed</span>
          </button>
          <div class="menu-divider"></div>
          <button class="menu-item danger" id="menuItemDelete">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/>
            </svg>
            <span data-i18n="deleteChecklist">Delete Checklist</span>
          </button>
        </div>

        <!-- Detail Scrollable Content Area -->
        <div class="detail-content" id="detailContent">
          <div id="sectionsContainer"></div>
        </div>

        <!-- Detail Bottom Action Toolbar -->
        <footer class="detail-toolbar">
          <!-- Add Task Button -->
          <button class="toolbar-btn primary" id="btnAddTask" title="Add Task">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
            </svg>
            <span data-i18n="addTask">Add Task</span>
          </button>

          <!-- Add Day/Section Button -->
          <button class="toolbar-btn" id="btnAddSection" title="Add Day / Section">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2zm-7 5h5v5h-5z"/>
            </svg>
            <span data-i18n="addSection">Add Section</span>
          </button>

          <!-- Cross out / strike task at cursor -->
          <button class="toolbar-btn" id="btnCrossOut" title="Cross Out Line">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M10 19h4v-3h-4v3zM5 4v3h5v3h4V7h5V4H5zM3 14h18v-2H3v2z"/>
            </svg>
            <span data-i18n="crossOutTask">Cross Out</span>
          </button>

          <!-- Clear text of task at cursor -->
          <button class="toolbar-btn" id="btnClearText" title='Clear Text ("")'>
            <span style="font-weight: 700; font-size: 1.1rem; line-height: 1;">""</span>
            <span data-i18n="clearText">Clear</span>
          </button>

          <span class="cursor-status-pill" id="cursorStatusPill" style="display: none;"></span>
        </footer>
      </main>

    </div>
  </div>

  <!-- ====================================================================
       Modals: New Checklist, New Section, Settings, Confirmation
       ==================================================================== -->

  <!-- Modal: New Checklist -->
  <div class="modal-backdrop" id="newChecklistModal">
    <div class="modal-sheet">
      <div class="modal-header">
        <h3 class="modal-title" data-i18n="newChecklist">New Checklist</h3>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label" data-i18n="checklistTitlePlaceholder">Checklist name...</label>
          <input type="text" class="form-input" id="newChecklistTitleInput" data-i18n-placeholder="checklistTitlePlaceholder" placeholder="Checklist name...">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="btnCreateChecklistCancel" data-i18n="cancel">Cancel</button>
        <button class="btn btn-primary" id="btnCreateChecklistConfirm" data-i18n="create">Create</button>
      </div>
    </div>
  </div>

  <!-- Modal: New Section / Day -->
  <div class="modal-backdrop" id="newSectionModal">
    <div class="modal-sheet">
      <div class="modal-header">
        <h3 class="modal-title" data-i18n="newSectionPrompt">New Section / Day</h3>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label" data-i18n="sectionTitlePlaceholder">Section name...</label>
          <input type="text" class="form-input" id="newSectionTitleInput" data-i18n-placeholder="sectionTitlePlaceholder" placeholder="Section name (e.g. Wednesday, Weekend)...">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="btnCreateSectionCancel" data-i18n="cancel">Cancel</button>
        <button class="btn btn-primary" id="btnCreateSectionConfirm" data-i18n="create">Create</button>
      </div>
    </div>
  </div>

  <!-- Modal: Settings & Data Management -->
  <div class="modal-backdrop" id="settingsModal">
    <div class="modal-sheet">
      <div class="modal-header">
        <h3 class="modal-title" data-i18n="settings">Settings</h3>
      </div>
      <div class="modal-body">
        <!-- Sort By -->
        <div class="form-group">
          <label class="form-label" data-i18n="sorting">Sort Checklists By</label>
          <select class="form-select" id="settingSortBy">
            <option value="updatedAt_desc" data-i18n="sortUpdated">Date Edited (Most Recent)</option>
            <option value="createdAt_desc" data-i18n="sortCreated">Date Created</option>
            <option value="title_asc" data-i18n="sortTitle">Alphabetical (A - Z)</option>
            <option value="manual" data-i18n="sortDefault">Manual / Default Order</option>
          </select>
        </div>

        <!-- Dark Mode -->
        <div class="form-group">
          <label class="form-label" data-i18n="darkMode">Dark Mode</label>
          <select class="form-select" id="settingTheme">
            <option value="light" data-i18n="themeLight">Light</option>
            <option value="dark" data-i18n="themeDark">Dark</option>
            <option value="system" data-i18n="themeSystem">System Auto</option>
          </select>
        </div>

        <!-- Font Size -->
        <div class="form-group">
          <label class="form-label" data-i18n="fontSize">Font Size in Checklist</label>
          <select class="form-select" id="settingFontSize">
            <option value="small" data-i18n="fontSizeSmall">Small</option>
            <option value="medium" data-i18n="fontSizeMedium">Medium</option>
            <option value="large" data-i18n="fontSizeLarge">Large</option>
            <option value="xlarge" data-i18n="fontSizeXLarge">Extra Large</option>
          </select>
        </div>

        <!-- Language -->
        <div class="form-group">
          <label class="form-label" data-i18n="language">Language</label>
          <select class="form-select" id="settingLanguage">
            <option value="en" data-i18n="langEn">English</option>
            <option value="de" data-i18n="langDe">Deutsch (German)</option>
          </select>
        </div>

        <div class="menu-divider" style="margin: 8px 0;"></div>

        <!-- Data Management -->
        <div class="form-group">
          <label class="form-label" data-i18n="dataManagement">Data Management</label>
          <div style="display: flex; gap: 10px; margin-top: 4px;">
            <button class="btn btn-secondary" id="btnExportData" style="flex: 1;">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
              <span data-i18n="exportData">Export JSON</span>
            </button>
            <button class="btn btn-secondary" id="btnImportData" style="flex: 1;">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/></svg>
              <span data-i18n="importData">Import JSON</span>
            </button>
            <input type="file" id="importFileInput" accept=".json,application/json" style="display: none;">
          </div>
        </div>

        <div class="form-group" style="margin-top: 6px;">
          <button class="btn btn-danger" id="btnResetAllData" style="width: 100%;">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
            <span data-i18n="resetData">Delete All Data (Factory Reset)</span>
          </button>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" id="btnCloseSettings" data-i18n="save">Close</button>
      </div>
    </div>
  </div>

  <!-- Modal: Confirmation Dialog -->
  <div class="modal-backdrop" id="confirmModal">
    <div class="modal-sheet">
      <div class="modal-header">
        <h3 class="modal-title" id="confirmModalTitle">Confirm Action</h3>
      </div>
      <div class="modal-body">
        <p id="confirmModalMessage" style="color: var(--text-muted); font-size: 0.95rem;"></p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="btnConfirmCancel" data-i18n="cancel">Cancel</button>
        <button class="btn btn-danger" id="btnConfirmAction" data-i18n="delete">Delete</button>
      </div>
    </div>
  </div>

  <!-- Notification Toast -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- Main JavaScript Module Entry -->
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
